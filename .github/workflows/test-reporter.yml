name: Test Reporter

# This workflow processes test results from the main workflow
# It runs with elevated permissions to create check runs
on:
  workflow_run:
    workflows: ["Optimized Package Publish"]
    types:
      - completed

permissions:
  checks: write
  pull-requests: write
  actions: read
  contents: read

jobs:
  test-reporter:
    name: Process Test Results
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'cancelled'
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    # Checkout is REQUIRED for dorny/test-reporter to work (it uses git commands internally)
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_branch }}
    
    - name: Download Artifacts
      uses: dawidd6/action-download-artifact@v3
      with:
        run_id: ${{ github.event.workflow_run.id }}
        name: test-results-${{ matrix.os }}
        path: test-results
    
    - name: Publish Test Results
      uses: dorny/test-reporter@v1
      with:
        name: Test Results (${{ matrix.os }})
        path: 'test-results/*.trx'
        reporter: dotnet-trx
        fail-on-error: false