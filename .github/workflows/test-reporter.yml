name: Test Reporter

# This workflow processes test results from the main workflow
# It runs with elevated permissions to create check runs
on:
  workflow_run:
    workflows: ["Optimized Package Publish"]
    types:
      - completed

permissions:
  checks: write
  pull-requests: write
  actions: read
  contents: read

jobs:
  test-reporter:
    name: Process Test Results
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'cancelled'
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - name: Download Artifacts
      uses: dawidd6/action-download-artifact@v3
      with:
        run_id: ${{ github.event.workflow_run.id }}
        name: test-results-${{ matrix.os }}
        path: test-results
    
    # Use EnricoMi/publish-unit-test-result-action instead - it's designed for workflow_run
    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        check_name: Test Results (${{ matrix.os }})
        files: test-results/*.trx
        commit: ${{ github.event.workflow_run.head_sha }}
        event_name: ${{ github.event.workflow_run.event }}