name: Test Reporter

# This workflow processes test results from the main workflow
# It runs with elevated permissions to create check runs
on:
  workflow_run:
    workflows: ["Optimized Package Publish"]
    types:
      - completed

permissions:
  checks: write
  pull-requests: write
  actions: read
  contents: read

jobs:
  test-reporter:
    name: Process Test Results
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'cancelled'
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - name: Download Test Results
      uses: actions/download-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: test-results/
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}
    
    - name: Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test Results (${{ matrix.os }})
        path: 'test-results/*.trx'
        reporter: dotnet-trx
        fail-on-error: false
        # Use the SHA from the workflow that triggered this one
        commit-sha: ${{ github.event.workflow_run.head_sha }}