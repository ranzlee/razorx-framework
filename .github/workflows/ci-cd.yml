name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]  # Now triggers on PRs to both main and dev branches
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      publish_package:
        description: 'Force publish package'
        required: false
        default: false
        type: boolean
      publish_to_nuget:
        description: 'Publish to NuGet.org (requires publish_package)'
        required: false
        default: false
        type: boolean
      skip_tests:
        description: 'Skip tests (use with caution)'
        required: false
        default: false
        type: boolean

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20'
  PACKAGE_OUTPUT_DIR: ${{ github.workspace }}/packages
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Job 1: Version Determination (lightweight, runs first)
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.gitversion.outputs.package-version }}
      is-release: ${{ steps.gitversion.outputs.is-release }}
      is-prerelease: ${{ steps.gitversion.outputs.is-prerelease }}
      should-publish: ${{ steps.decision.outputs.should-publish }}
      should-publish-nuget: ${{ steps.decision.outputs.should-publish-nuget }}
      build-config: ${{ steps.config.outputs.build-config }}
    
    steps:
    - name: Checkout (shallow)
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        fetch-tags: true
    
    - name: Determine Version Strategy
      id: gitversion
      run: |
        # Enhanced version determination with branch-based strategy
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          
          # Check if it's a prerelease (beta, rc, etc.)
          if [[ "$VERSION" == *"-beta."* ]] || [[ "$VERSION" == *"-rc."* ]] || [[ "$VERSION" == *"-alpha."* ]]; then
            IS_PRERELEASE=true
            IS_RELEASE=false
            echo "🔵 Pre-release version: $VERSION"
          else
            IS_PRERELEASE=false
            IS_RELEASE=true
            echo "📦 Release version: $VERSION"
          fi
        elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          # Main branch - beta with build metadata
          BASE_VERSION=$(grep -oP '<PackageVersion>\K[^<-]+' RazorX.Framework/RazorX.Framework.csproj | head -1)
          VERSION="${BASE_VERSION}-beta.${{ github.run_number }}+${GITHUB_SHA:0:7}"
          IS_RELEASE=false
          IS_PRERELEASE=true
          echo "🔵 Beta version: $VERSION"
        elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
          # Dev branch - alpha with timestamp
          BASE_VERSION=$(grep -oP '<PackageVersion>\K[^<-]+' RazorX.Framework/RazorX.Framework.csproj | head -1)
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          VERSION="${BASE_VERSION}-alpha.${{ github.run_number }}.${TIMESTAMP}"
          IS_RELEASE=false
          IS_PRERELEASE=true
          echo "🟡 Alpha version: $VERSION"
        elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
          # PR - preview version
          BASE_VERSION=$(grep -oP '<PackageVersion>\K[^<-]+' RazorX.Framework/RazorX.Framework.csproj | head -1)
          VERSION="${BASE_VERSION}-preview.${{ github.event.pull_request.number }}.${{ github.run_number }}"
          IS_RELEASE=false
          IS_PRERELEASE=true
          echo "🟣 Preview version: $VERSION"
        else
          # Fallback
          VERSION="0.0.0-dev.${{ github.run_number }}"
          IS_RELEASE=false
          IS_PRERELEASE=true
          echo "⚪ Dev version: $VERSION"
        fi
        
        echo "package-version=$VERSION" >> $GITHUB_OUTPUT
        echo "is-release=$IS_RELEASE" >> $GITHUB_OUTPUT
        echo "is-prerelease=${IS_PRERELEASE:-false}" >> $GITHUB_OUTPUT
    
    - name: Publish Decision Matrix
      id: decision
      run: |
        SHOULD_PUBLISH=false
        SHOULD_PUBLISH_NUGET=false
        
        # Enhanced decision matrix for GitHub Packages
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          SHOULD_PUBLISH=true
          echo "✅ Will publish to GitHub Packages: Release tag"
        elif [[ "${{ github.ref }}" == "refs/heads/main" && "${{ github.event_name }}" == "push" ]]; then
          SHOULD_PUBLISH=true
          echo "✅ Will publish to GitHub Packages: Main branch push"
        elif [[ "${{ github.ref }}" == "refs/heads/dev" && "${{ github.event_name }}" == "push" ]]; then
          # Optional: publish dev builds
          SHOULD_PUBLISH=false
          echo "⏭️ Skip publish: Dev branch (change to true if desired)"
        elif [[ "${{ github.event.inputs.publish_package }}" == "true" ]]; then
          SHOULD_PUBLISH=true
          echo "✅ Will publish to GitHub Packages: Manual trigger"
        else
          echo "⏭️ Skip publish: Conditions not met"
        fi
        
        # NuGet.org publishing decision - now includes main branch beta releases
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          # Auto-publish tagged releases to NuGet.org
          SHOULD_PUBLISH_NUGET=true
          echo "✅ Will publish to NuGet.org: Tagged release"
        elif [[ "${{ github.ref }}" == "refs/heads/main" && "${{ github.event_name }}" == "push" ]]; then
          # Auto-publish beta versions from main branch to NuGet.org
          SHOULD_PUBLISH_NUGET=true
          echo "✅ Will publish to NuGet.org: Main branch beta release"
        elif [[ "${{ github.event.inputs.publish_to_nuget }}" == "true" && "${{ github.event.inputs.publish_package }}" == "true" ]]; then
          # Manual trigger for NuGet.org
          SHOULD_PUBLISH_NUGET=true
          echo "✅ Will publish to NuGet.org: Manual trigger"
        else
          echo "⏭️ Skip NuGet.org publish: Criteria not met"
        fi
        
        echo "should-publish=$SHOULD_PUBLISH" >> $GITHUB_OUTPUT
        echo "should-publish-nuget=$SHOULD_PUBLISH_NUGET" >> $GITHUB_OUTPUT
    
    - name: Build Configuration
      id: config
      run: |
        # Determine build configuration based on branch/tag
        if [[ "${{ steps.gitversion.outputs.is-release }}" == "true" ]]; then
          echo "build-config=Release" >> $GITHUB_OUTPUT
        else
          echo "build-config=Debug" >> $GITHUB_OUTPUT
        fi

  # Job 2: Matrix Build and Test
  build-test-matrix:
    name: Build & Test (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: |
          RazorX.Framework/Node/package-lock.json
          RazorX.Framework.Tests/Node/package-lock.json
    
    # Enhanced caching with hash-based keys
    - name: Cache - NuGet
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}-${{ needs.version.outputs.package-version }}
        restore-keys: |
          ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}-
          ${{ runner.os }}-nuget-
    
    - name: Cache - Build Output
      uses: actions/cache@v4
      with:
        path: |
          **/bin
          **/obj
        key: ${{ runner.os }}-build-${{ github.sha }}-${{ needs.version.outputs.build-config }}
        restore-keys: |
          ${{ runner.os }}-build-${{ github.sha }}-
          ${{ runner.os }}-build-
    
    - name: Update Version
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          pwsh -Command "(Get-Content RazorX.Framework/RazorX.Framework.csproj) -replace '<PackageVersion>.*</PackageVersion>', '<PackageVersion>${{ needs.version.outputs.package-version }}</PackageVersion>' | Set-Content RazorX.Framework/RazorX.Framework.csproj"
        else
          sed -i.bak "s|<PackageVersion>.*</PackageVersion>|<PackageVersion>${{ needs.version.outputs.package-version }}</PackageVersion>|" RazorX.Framework/RazorX.Framework.csproj
        fi
    
    # Install npm dependencies BEFORE dotnet build (which triggers npm build via MSBuild)
    - name: Install Framework Node Dependencies
      shell: bash
      working-directory: RazorX.Framework/Node
      run: npm ci || npm install
    
    - name: Restore
      run: dotnet restore --locked-mode
    
    - name: Build
      run: dotnet build --no-restore --configuration ${{ needs.version.outputs.build-config }} -p:ContinuousIntegrationBuild=true
    
    - name: Test (.NET)
      if: github.event.inputs.skip_tests != 'true'
      shell: bash
      run: dotnet test --no-build --configuration ${{ needs.version.outputs.build-config }} --verbosity normal --logger "trx;LogFileName=${{ matrix.os }}-test-results.trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
    
    - name: Test (JavaScript)
      if: github.event.inputs.skip_tests != 'true' && matrix.os == 'ubuntu-latest'
      shell: bash
      working-directory: RazorX.Framework.Tests/Node
      run: |
        npm ci || npm install
        npm run test:coverage
    
    # Upload test results for processing by separate test-reporter workflow
    # Note: Test reporting moved to separate workflow due to permission restrictions
    # on pull requests from forks. See .github/workflows/test-reporter.yml
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: |
          TestResults/*.trx
          TestResults/**/*.xml
          RazorX.Framework.Tests/Node/coverage/
        retention-days: 7

  # Job 3: Package Creation (single job, reuses artifacts)
  package:
    name: Create Package
    needs: [version, build-test-matrix]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: RazorX.Framework/Node/package-lock.json
    
    - name: Restore Caches
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}-${{ needs.version.outputs.package-version }}
    
    - name: Update Version
      run: |
        sed -i "s|<PackageVersion>.*</PackageVersion>|<PackageVersion>${{ needs.version.outputs.package-version }}</PackageVersion>|" RazorX.Framework/RazorX.Framework.csproj
    
    - name: Build for Packaging
      run: |
        dotnet restore --locked-mode
        dotnet build --configuration Release --no-restore -p:ContinuousIntegrationBuild=true
    
    - name: Create NuGet Package
      run: |
        mkdir -p ${{ env.PACKAGE_OUTPUT_DIR }}
        dotnet pack RazorX.Framework/RazorX.Framework.csproj \
          --configuration Release \
          --no-build \
          --output ${{ env.PACKAGE_OUTPUT_DIR }} \
          --include-symbols \
          --include-source \
          -p:PackageVersion=${{ needs.version.outputs.package-version }} \
          -p:SymbolPackageFormat=snupkg
    
    # Generate SBOM (Software Bill of Materials)
    - name: Generate SBOM
      run: |
        dotnet tool install --global Microsoft.Sbom.DotNetTool
        sbom-tool generate \
          -b ${{ env.PACKAGE_OUTPUT_DIR }} \
          -bc RazorX.Framework \
          -pn RazorX.Framework \
          -pv ${{ needs.version.outputs.package-version }} \
          -ps "Randy Lee" \
          -nsb https://github.com/ranzlee/razorx-framework
    
    - name: Upload Package Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: |
          ${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg
          ${{ env.PACKAGE_OUTPUT_DIR }}/*.snupkg
          ${{ env.PACKAGE_OUTPUT_DIR }}/_manifest/
        retention-days: 30

  # Job 4: Enhanced Package Validation
  validate:
    name: Validate Package
    needs: [version, package]
    runs-on: ubuntu-latest
    if: needs.version.outputs.should-publish == 'true'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Download Package
      uses: actions/download-artifact@v5
      with:
        name: nuget-packages
        path: ${{ env.PACKAGE_OUTPUT_DIR }}
    
    # Enhanced validation with multiple checks
    - name: Package Structure Validation
      run: |
        PACKAGE_FILE=$(find ${{ env.PACKAGE_OUTPUT_DIR }} -name "*.nupkg" | grep -v ".symbols." | head -1)
        echo "Validating package: $PACKAGE_FILE"
        
        # Extract and validate
        mkdir -p validate-extract
        cd validate-extract
        unzip -q "$PACKAGE_FILE"
        
        # Check required files
        REQUIRED_FILES=(
          "contentFiles/any/any/wwwroot/js/razorx.js"
          "contentFiles/any/any/wwwroot/js/razorx.js.map"
          "contentFiles/any/any/wwwroot/js/razorx.d.ts"
          "contentFiles/any/any/wwwroot/css/razorx.css"
          "build/RazorX.Framework.targets"
          "lib/net9.0/RazorX.Framework.dll"
        )
        
        for file in "${REQUIRED_FILES[@]}"; do
          if [[ -f "$file" ]]; then
            echo "✅ Found: $file"
          else
            echo "❌ Missing: $file"
            exit 1
          fi
        done
    
    - name: Installation Test
      run: |
        # Create test project
        mkdir -p test-install
        cd test-install
        dotnet new web --name TestApp --force
        cd TestApp
        
        # Install package
        dotnet add package RazorX.Framework \
          --version ${{ needs.version.outputs.package-version }} \
          --source "${{ env.PACKAGE_OUTPUT_DIR }}"
        
        # Build and verify
        dotnet build
        
        # Check client files
        if [[ -f "wwwroot/js/razorx.js" ]]; then
          echo "✅ JavaScript files installed correctly"
        else
          echo "❌ JavaScript files not found"
          exit 1
        fi
        
        if [[ -f "wwwroot/css/razorx.css" ]]; then
          echo "✅ CSS files installed correctly"
        else
          echo "❌ CSS files not found"
          exit 1
        fi
    
    - name: Security Scan
      run: |
        # Install security scanner
        dotnet tool install --global security-scan
        
        # Scan package
        security-scan ${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg || true

  # Job 5: Publish to GitHub Packages with attestation
  publish:
    name: Publish to GitHub Packages
    needs: [version, validate]
    runs-on: ubuntu-latest
    if: needs.version.outputs.should-publish == 'true'
    permissions:
      packages: write
      contents: read
      id-token: write # For OIDC attestation
      attestations: write
    
    steps:
    - name: Download Package
      uses: actions/download-artifact@v5
      with:
        name: nuget-packages
        path: ${{ env.PACKAGE_OUTPUT_DIR }}
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    # Generate provenance attestation
    - name: Generate SLSA Provenance
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: '${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg'
    
    - name: Publish Package
      run: |
        PACKAGE_FILE=$(find ${{ env.PACKAGE_OUTPUT_DIR }} -name "*.nupkg" | grep -v ".symbols." | head -1)
        SYMBOL_FILE=$(find ${{ env.PACKAGE_OUTPUT_DIR }} -name "*.snupkg" | head -1)
        
        echo "📦 Publishing: $(basename $PACKAGE_FILE)"
        
        # Publish main package
        dotnet nuget push "$PACKAGE_FILE" \
          --api-key ${{ github.token }} \
          --source https://nuget.pkg.github.com/ranzlee/index.json \
          --skip-duplicate \
          --no-symbols
        
        # Publish symbols if available
        if [[ -f "$SYMBOL_FILE" ]]; then
          echo "🔍 Publishing symbols: $(basename $SYMBOL_FILE)"
          dotnet nuget push "$SYMBOL_FILE" \
            --api-key ${{ github.token }} \
            --source https://nuget.pkg.github.com/ranzlee/index.json \
            --skip-duplicate
        fi
    
    - name: Package Metrics
      run: |
        # Query GitHub Packages GraphQL API for download stats
        curl -H "Authorization: bearer ${{ github.token }}" \
          -X POST \
          -d '{"query":"query { repository(owner:\"ranzlee\", name:\"razorx-framework\") { packages(first: 10) { nodes { name statistics { downloadsTotalCount } } } } }"}' \
          https://api.github.com/graphql | jq .

  # Job 6: Publish to NuGet.org
  publish-nuget:
    name: Publish to NuGet.org
    needs: [version, validate]
    runs-on: ubuntu-latest
    if: needs.version.outputs.should-publish-nuget == 'true'
    environment: nuget
    
    steps:
    - name: Download Package
      uses: actions/download-artifact@v5
      with:
        name: nuget-packages
        path: ${{ env.PACKAGE_OUTPUT_DIR }}
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Verify Package Before Publishing
      run: |
        PACKAGE_FILE=$(find ${{ env.PACKAGE_OUTPUT_DIR }} -name "*.nupkg" | grep -v ".symbols." | head -1)
        echo "📦 Package to publish: $(basename $PACKAGE_FILE)"
        echo "📏 Package size: $(du -h $PACKAGE_FILE | cut -f1)"
        
        # Verify package metadata
        dotnet nuget locals all --list
        
        # Test package installation locally
        mkdir -p test-local-install
        cd test-local-install
        dotnet new classlib --name TestInstall --force
        cd TestInstall
        dotnet add package RazorX.Framework --version ${{ needs.version.outputs.package-version }} --source "${{ env.PACKAGE_OUTPUT_DIR }}"
        
        if [ $? -eq 0 ]; then
          echo "✅ Package installation test successful"
        else
          echo "❌ Package installation test failed"
          exit 1
        fi
    
    - name: Publish to NuGet.org
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        PACKAGE_FILE=$(find ${{ env.PACKAGE_OUTPUT_DIR }} -name "*.nupkg" | grep -v ".symbols." | head -1)
        SYMBOL_FILE=$(find ${{ env.PACKAGE_OUTPUT_DIR }} -name "*.snupkg" | head -1)
        
        echo "📦 Publishing to NuGet.org: $(basename $PACKAGE_FILE)"
        echo "🔖 Version: ${{ needs.version.outputs.package-version }}"
        echo "🏷️ Pre-release: ${{ needs.version.outputs.is-prerelease }}"
        
        # Publish main package
        dotnet nuget push "$PACKAGE_FILE" \
          --api-key $NUGET_API_KEY \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate \
          --no-symbols
        
        # Publish symbols if available
        if [[ -f "$SYMBOL_FILE" ]]; then
          echo "🔍 Publishing symbols: $(basename $SYMBOL_FILE)"
          dotnet nuget push "$SYMBOL_FILE" \
            --api-key $NUGET_API_KEY \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        fi
    
    - name: Verify NuGet.org Availability
      run: |
        echo "⏳ Waiting for package to be available on NuGet.org..."
        sleep 30  # Give NuGet.org time to process
        
        # Check if package is available
        RESPONSE=$(curl -s "https://api.nuget.org/v3-flatcontainer/razorx.framework/${{ needs.version.outputs.package-version }}/razorx.framework.${{ needs.version.outputs.package-version }}.nupkg" -o /dev/null -w "%{http_code}")
        
        if [ "$RESPONSE" = "200" ]; then
          echo "✅ Package is now available on NuGet.org!"
          echo "🔗 View at: https://www.nuget.org/packages/RazorX.Framework/${{ needs.version.outputs.package-version }}"
        else
          echo "⚠️ Package may still be processing. Check NuGet.org in a few minutes."
        fi
    
    - name: Create Deployment Record
      if: success()
      run: |
        echo "## 📦 NuGet.org Deployment" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Package**: RazorX.Framework" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: \`${{ needs.version.outputs.package-version }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Type**: ${{ needs.version.outputs.is-prerelease == 'true' && '🔵 Pre-release' || '🚀 Stable' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **URL**: [View on NuGet.org](https://www.nuget.org/packages/RazorX.Framework/${{ needs.version.outputs.package-version }})" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Installation" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo "dotnet add package RazorX.Framework --version ${{ needs.version.outputs.package-version }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

  # Job 7: Create Release and Generate Notes
  release:
    name: Create Release
    needs: [version, publish, publish-nuget]
    runs-on: ubuntu-latest
    # Run if it's a release/prerelease and at least one publish succeeded
    if: |
      (needs.version.outputs.is-release == 'true' || needs.version.outputs.is-prerelease == 'true') &&
      (needs.publish.result == 'success' || needs.publish-nuget.result == 'success')
    permissions:
      contents: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    
    - name: Generate Release Notes
      id: notes
      run: |
        # Generate release notes from commits
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        
        if [[ -n "$PREVIOUS_TAG" ]]; then
          echo "Generating notes from $PREVIOUS_TAG to HEAD"
          
          # Categorize commits
          echo "## What's Changed" > release-notes.md
          echo "" >> release-notes.md
          
          # Features
          git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" --grep="feat:" >> release-notes.md || true
          
          # Fixes
          echo "" >> release-notes.md
          echo "### 🐛 Bug Fixes" >> release-notes.md
          git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" --grep="fix:" >> release-notes.md || true
          
          # Performance
          echo "" >> release-notes.md
          echo "### ⚡ Performance" >> release-notes.md
          git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" --grep="perf:" >> release-notes.md || true
        else
          echo "## Initial Release" > release-notes.md
          echo "First release of RazorX.Framework" >> release-notes.md
        fi
        
        echo "notes-file=release-notes.md" >> $GITHUB_OUTPUT
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ needs.version.outputs.package-version }}
        name: RazorX.Framework v${{ needs.version.outputs.package-version }}
        body_path: ${{ steps.notes.outputs.notes-file }}
        draft: false
        prerelease: ${{ needs.version.outputs.is-prerelease == 'true' }}
        generate_release_notes: true # GitHub's auto-generated notes as supplement

  # Job 8: Summary and Notifications
  summary:
    name: Publication Summary
    needs: [version, build-test-matrix, package, validate, publish, publish-nuget]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Generate Summary
      run: |
        echo "# 📊 Build & Publish Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Version info
        echo "## 📦 Package Information" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: \`${{ needs.version.outputs.package-version }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Release Type**: ${{ needs.version.outputs.is-release == 'true' && '🚀 Production' || '🔧 Pre-release' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Published**: ${{ needs.version.outputs.should-publish == 'true' && '✅ Yes' || '⏭️ No' }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Build matrix results
        echo "## 🏗️ Build Matrix Results" >> $GITHUB_STEP_SUMMARY
        echo "| OS | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| Ubuntu | ${{ contains(needs.build-test-matrix.result, 'success') && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Windows | ${{ contains(needs.build-test-matrix.result, 'success') && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| macOS | ${{ contains(needs.build-test-matrix.result, 'success') && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Job status
        echo "## 📋 Job Status" >> $GITHUB_STEP_SUMMARY
        echo "- Version Detection: ${{ needs.version.result == 'success' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
        echo "- Build & Test: ${{ needs.build-test-matrix.result == 'success' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
        echo "- Package Creation: ${{ needs.package.result == 'success' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
        echo "- Validation: ${{ needs.validate.result == 'success' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
        echo "- GitHub Packages: ${{ needs.publish.result == 'success' && '✅' || needs.publish.result == 'skipped' && '⏭️' || '❌' }}" >> $GITHUB_STEP_SUMMARY
        echo "- NuGet.org: ${{ needs.publish-nuget.result == 'success' && '✅' || needs.publish-nuget.result == 'skipped' && '⏭️' || '❌' }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Installation instructions based on where it was published
        if [[ "${{ needs.publish-nuget.result }}" == "success" ]]; then
          echo "## 🚀 Installation from NuGet.org" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "dotnet add package RazorX.Framework --version ${{ needs.version.outputs.package-version }}" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.version.outputs.is-prerelease }}" == "true" ]]; then
            echo "# Or to always get the latest prerelease:" >> $GITHUB_STEP_SUMMARY
            echo "dotnet add package RazorX.Framework --prerelease" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
        elif [[ "${{ needs.publish.result }}" == "success" ]]; then
          echo "## 🚀 Installation from GitHub Packages" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# Configure GitHub Packages source" >> $GITHUB_STEP_SUMMARY
          echo "dotnet nuget add source https://nuget.pkg.github.com/ranzlee/index.json \\" >> $GITHUB_STEP_SUMMARY
          echo "  --name github \\" >> $GITHUB_STEP_SUMMARY
          echo "  --username YOUR_GITHUB_USERNAME \\" >> $GITHUB_STEP_SUMMARY
          echo "  --password YOUR_GITHUB_TOKEN" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Install package" >> $GITHUB_STEP_SUMMARY
          echo "dotnet add package RazorX.Framework --version ${{ needs.version.outputs.package-version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
        
        # Performance metrics
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## ⏱️ Performance Metrics" >> $GITHUB_STEP_SUMMARY
        echo "- **Total Duration**: ${{ github.run_number }} seconds" >> $GITHUB_STEP_SUMMARY
        echo "- **Parallel Jobs**: 3 OS builds" >> $GITHUB_STEP_SUMMARY
        echo "- **Cache Hit Rate**: Check individual job logs" >> $GITHUB_STEP_SUMMARY