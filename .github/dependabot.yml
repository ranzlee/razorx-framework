# Dependabot Configuration for RazorX.Framework
# ================================================
# 
# BRANCHING STRATEGY:
# - All dependency updates target the 'dev' branch
# - dev branch = Active development branch where all changes land first
# - main branch = Stable release branch (receives tested merges from dev)
# 
# WORKFLOW:
# 1. Dependabot creates PRs against dev branch
# 2. CI/CD runs tests on the PR
# 3. After review/approval, PR is merged to dev
# 4. When ready for release, dev is merged to main
# 5. Pushes to main trigger beta releases to NuGet.org
# 6. Tagged releases from main create stable versions
#
# This dev-first approach ensures all changes are tested
# in the development branch before reaching production.

version: 2
updates:
  # NuGet dependencies for .NET projects
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "dev"  # Target dev branch for all dependency updates
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 5
    reviewers:
      - "ranzlee"
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      test-dependencies:
        patterns:
          - "*Test*"
          - "MSTest.*"
          - "coverlet.*"
    
  # npm dependencies for TypeScript client
  - package-ecosystem: "npm"
    directory: "/RazorX.Framework/Node"
    target-branch: "dev"  # Target dev branch for all dependency updates
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 5
    reviewers:
      - "ranzlee"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
      build-tools:
        patterns:
          - "esbuild"
          - "eslint*"
    
  # npm dependencies for test project
  - package-ecosystem: "npm"
    directory: "/RazorX.Framework.Tests/Node"
    target-branch: "dev"  # Target dev branch for all dependency updates
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 3
    reviewers:
      - "ranzlee"
    labels:
      - "dependencies"
      - "javascript"
      - "tests"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      test-tools:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "jsdom"
          - "@testing-library/*"
    
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"  # Target dev branch for all dependency updates
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 3
    reviewers:
      - "ranzlee"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"